name: CI and Cloudflare deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Account regression checks (isolated local database)
        run: node scripts/test-accounts.mjs
      - run: npm run deploy:package
      - name: Validate packaged Worker
        run: npx --no-install wrangler deploy --dry-run --config ../deployment/wrangler.json
      - name: Save checked deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            deployment/server/
            deployment/client/
            deployment/migrations/
            deployment/wrangler.json
            deployment/package.json
            deployment/package-lock.json
            deployment/setup-key.mjs
            deployment/check-d1-access.mjs

  deploy:
    name: Deploy production
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://auctionhouse.pk
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: deployment
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deployment-${{ github.sha }}
          path: deployment
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
      - name: Check deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID secret'; exit 1; }
      - run: npm ci
      - name: Diagnose Cloudflare D1 access
        run: node check-d1-access.mjs
      - name: Apply pending production migrations
        # Wrangler skips confirmation automatically in non-interactive CI.
        run: npm run database
      - name: Preserve or initialize encryption key
        run: npm run setup-key
      - name: Deploy checked Worker and assets
        run: npm run deploy
